<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator | DevToolBox</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .tool-page {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 20px;
        }

        .password-tool {
            width: 100%;
            max-width: 850px;
        }

        .tool-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .tool-heading .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: rgba(124, 92, 255, 0.12);
            border: 1px solid rgba(124, 92, 255, 0.25);
            font-size: 32px;
        }

        .tool-heading h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 12px;
        }

        .tool-heading p {
            color: var(--text-muted);
            max-width: 600px;
            margin: auto;
            line-height: 1.7;
        }

        .generator-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
        }

        .password-display {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .password-output {
            flex: 1;
            min-height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: var(--bg-dark);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            color: var(--text-light);
            font-family: "Courier New", monospace;
            font-size: 18px;
            overflow: hidden;
            word-break: break-all;
        }

        .copy-btn {
            min-width: 110px;
            border: 1px solid var(--border-light);
            border-radius: 14px;
            background: var(--bg-card-light);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }

        .settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .setting {
            padding: 20px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .setting.full {
            grid-column: 1 / -1;
        }

        .setting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .setting-title {
            font-weight: 600;
            color: var(--text-main);
        }

        .length-value {
            color: var(--accent-light);
            font-weight: 700;
            font-size: 18px;
        }

        .length-slider {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .check-option {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-light);
            cursor: pointer;
        }

        .check-option input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .strength-section {
            margin-top: 25px;
            padding: 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border);
        }

        .strength-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .strength-label {
            color: var(--text-muted);
        }

        .strength-value {
            color: var(--text-light);
            font-weight: 700;
        }

        .strength-bar {
            width: 100%;
            height: 7px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .strength-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .generate-btn {
            width: 100%;
            margin-top: 25px;
            min-height: 58px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent-dark)
            );
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 12px 30px rgba(124, 92, 255, 0.22);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(124, 92, 255, 0.32);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s ease;
        }

        .back-link:hover {
            color: var(--accent-light);
        }

        @media (max-width: 650px) {
            .generator-box {
                padding: 20px;
            }

            .settings {
                grid-template-columns: 1fr;
            }

            .setting.full {
                grid-column: auto;
            }

            .password-display {
                flex-direction: column;
            }

            .copy-btn {
                min-height: 50px;
            }
        }

        @media (max-width: 450px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container nav-container">

            <a href="index.html" class="logo">
                <span class="logo-symbol">&lt;/&gt;</span>
                DevToolBox
            </a>

            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
                <a href="index.html#about">About</a>
            </nav>

            <a href="index.html#tools" class="nav-button">
                All Tools
            </a>

        </div>
    </header>


    <!-- Password Generator -->
    <main class="tool-page">

        <div class="password-tool">

            <div class="tool-heading">

                <div class="tool-icon">
                    🔐
                </div>

                <h1>Password Generator</h1>

                <p>
                    Create strong and secure passwords instantly.
                    Customize the length and characters according to your needs.
                </p>

            </div>


            <div class="generator-box">

                <!-- Password Display -->
                <div class="password-display">

                    <div class="password-output">
                        Your password will appear here
                    </div>

                    <button class="copy-btn" type="button">
                        Copy
                    </button>

                </div>


                <!-- Settings -->
                <div class="settings">

                    <!-- Password Length -->
                    <div class="setting full">

                        <div class="setting-header">

                            <span class="setting-title">
                                Password Length
                            </span>

                            <span class="length-value">
                                16
                            </span>

                        </div>

                        <input
                            type="range"
                            class="length-slider"
                            min="6"
                            max="50"
                            value="16"
                        >

                    </div>


                    <!-- Character Options -->
                    <div class="setting full">

                        <div class="setting-header">

                            <span class="setting-title">
                                Character Options
                            </span>

                        </div>

                        <div class="checkbox-group">

                            <label class="check-option">
                                <input type="checkbox" checked>
                                Uppercase Letters
                            </label>

                            <label class="check-option">
                                <input type="checkbox" checked>
                                Lowercase Letters
                            </label>

                            <label class="check-option">
                                <input type="checkbox" checked>
                                Numbers
                            </label>

                            <label class="check-option">
                                <input type="checkbox" checked>
                                Symbols
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Strength -->
                <div class="strength-section">

                    <div class="strength-top">

                        <span class="strength-label">
                            Password Strength
                        </span>

                        <span class="strength-value">
                            Not Generated
                        </span>

                    </div>

                    <div class="strength-bar">
                        <div class="strength-fill"></div>
                    </div>

                </div>


                <!-- Generate Button -->
                <button class="generate-btn" type="button">
                    Generate Strong Password
                </button>

            </div>


            <a href="index.html#tools" class="back-link">
                ← Back to DevToolBox
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
